name: Build SDFSpy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          clang --version | head -n 1

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" submodule update --init --recursive --depth=1

      - name: Build tweak (Theos + native Xcode)
        run: |
          set -e
          export THEOS="$HOME/theos"
          make clean package
          ls -lh packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDFSpy-${{ github.ref_name }}
          path: packages/*.deb
          retention-days: 14

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
          generate_body: true
