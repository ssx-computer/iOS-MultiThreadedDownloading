name: Build SDFSpy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build tweak (Theos + Xcode 16.5, via Docker)
        run: |
          docker run --rm \
            -v "$PWD":/build -w /build \
            xcodeorg/xcode:16.5 \
            bash -c '
              set -e
              if [ ! -d /Theos ]; then
                git clone --depth=1 https://github.com/theos/theos.git /Theos
              fi
              export THEOS=/Theos
              make clean package
              ls -lh _Packages/arm64/
            '

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDFSpy-${{ github.ref_name }}
          path: _Packages/arm64/*.deb
          retention-days: 14

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _Packages/arm64/*.deb
          generate_body: true
